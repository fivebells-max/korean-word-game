<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새말 형성 탐험대 - 어근과 접사 퀴즈</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --success: #10b981;
      --error: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      padding: 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header {
      margin-bottom: 24px;
    }

    .title-badge {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 15px;
    }

    .progress-bar-bg {
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #6366f1, #10b981);
      height: 100%;
      width: 5%;
      transition: width 0.4s ease;
    }

    .card-wrapper {
      perspective: 1000px;
      margin-bottom: 24px;
    }

    .word-card {
      background: linear-gradient(135deg, #ffffff, #f1f5f9);
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 36px 20px;
      position: relative;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .type-tag {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      color: #fff;
    }

    .type-tag.root { background-color: #3b82f6; }
    .type-tag.affix { background-color: #ec4899; }

    .card-word {
      font-size: 48px;
      font-weight: 900;
      color: #0f172a;
      margin: 12px 0 8px 0;
      letter-spacing: 2px;
    }

    .card-hint {
      font-size: 14px;
      color: #64748b;
      word-break: keep-all;
    }

    .correct-anim {
      animation: pop 0.5s ease;
      border-color: var(--success) !important;
      background: #ecfdf5 !important;
    }

    .incorrect-anim {
      animation: shake 0.4s ease;
      border-color: var(--error) !important;
      background: #fef2f2 !important;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.submit-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.submit-btn:hover { background-color: #4338ca; }
    button.submit-btn:active { transform: scale(0.98); }

    .message-area {
      min-height: 60px;
      font-size: 15px;
      font-weight: 700;
      word-break: keep-all;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .msg-main { font-weight: 800; }
    .msg-meaning {
      font-size: 13.5px;
      font-weight: 600;
      color: #1e293b;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 10px;
      margin-top: 4px;
      line-height: 1.4;
    }

    .msg-correct { color: var(--success); }
    .msg-incorrect { color: var(--error); }
    .msg-info { color: var(--primary); }

    .clear-screen {
      display: none;
      padding: 20px 0;
    }

    .trophy-emoji {
      font-size: 72px;
      margin-bottom: 16px;
      animation: pop 0.8s infinite alternate;
    }

    .clear-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }

    .clear-desc {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .restart-btn {
      background-color: var(--success);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="game-screen">
      <div class="header">
        <span class="title-badge">중1 국어 2단원 84-85p</span>
        <h2>새말 형성 탐험대 🔍</h2>
      </div>

      <div class="status-bar">
        <span id="question-count">문제 1 / 20</span>
        <span id="score-count">점수: 0점</span>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div class="card-wrapper">
        <div id="word-card" class="word-card">
          <span id="type-tag" class="type-tag affix">접사</span>
          <div id="card-word" class="card-word">풋-</div>
          <p id="card-hint" class="card-hint">어근 앞에 붙어 ‘덜 익은’의 뜻을 더함</p>
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="user-input" placeholder="새로운 단어를 입력하세요" autocomplete="off">
        <button class="submit-btn" id="submit-btn">확인</button>
      </div>

      <div id="message" class="message-area"></div>
    </div>

    <div id="clear-screen" class="clear-screen">
      <div class="trophy-emoji">🎉🏆🎉</div>
      <h2 class="clear-title">탐험 성공! 축하합니다!</h2>
      <p class="clear-desc">100개의 무작위 문제 중 20문제를 완벽히 풀어 탐험을 완료했습니다!</p>
      <button class="restart-btn" id="restart-btn">새로운 문제로 다시 도전하기</button>
    </div>
  </div>

    const BANNED_TERMS = ['위키', '닷컴', '게임', '채널', '나무위키', '유튜브'];

    let quizData = [];
    let currentIndex = 0;
    let score = 0;
    let isProcessing = false;

    const gameScreen = document.getElementById('game-screen');
    const clearScreen = document.getElementById('clear-screen');
    const questionCountEl = document.getElementById('question-count');
    const scoreCountEl = document.getElementById('score-count');
    const progressBarEl = document.getElementById('progress-bar');
    const wordCardEl = document.getElementById('word-card');
    const typeTagEl = document.getElementById('type-tag');
    const cardWordEl = document.getElementById('card-word');
    const cardHintEl = document.getElementById('card-hint');
    const userInputEl = document.getElementById('user-input');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restart-btn');

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initGame() {
      const shuffled = shuffleArray(questionBank);
      quizData = shuffled.slice(0, 20);
      currentIndex = 0;
      score = 0;
      
      clearScreen.style.display = 'none';
      gameScreen.style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      const q = quizData[currentIndex];
      typeTagEl.textContent = q.type;
      typeTagEl.className = `type-tag ${q.tagClass}`;
      cardWordEl.textContent = q.word;
      cardHintEl.textContent = q.hint;
      
      questionCountEl.textContent = `문제 ${currentIndex + 1} / ${quizData.length}`;
      scoreCountEl.textContent = `점수: ${score}점`;
      progressBarEl.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
      
      userInputEl.value = '';
      userInputEl.focus();
      messageEl.innerHTML = '';
      messageEl.className = 'message-area';
      wordCardEl.className = 'word-card';
      isProcessing = false;
    }

    // 위키낱말사전 API에서 문서 본문 텍스트(뜻풀이)까지 함께 추출하는 함수
    async function fetchMeaningFromOpenDictAPI(word) {
      try {
        const url = `https://ko.wiktionary.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(word)}&format=json&origin=*`;
        const response = await fetch(url);
        if (!response.ok) return null;
        const data = await response.json();
        const pages = data.query.pages;
        const pageId = Object.keys(pages)[0];
        
        if (pageId === "-1") return null;
        
        let extract = pages[pageId].extract;
        if (!extract) return `${word}(은)는 표준국어사전에 등재된 표준어입니다.`;

        // 위키 위키 텍스트에서 첫 줄이나 주요 정의 부분만 추출하여 깔끔하게 가공
        let lines = extract.split('\n').filter(line => line.trim().length > 0);
        let meaningLine = lines.find(l => l.includes('1.') || l.includes('뜻') || l.length > 5) || lines[0];
        meaningLine = meaningLine.replace(/^[\s\d\.\:\-]+/, '').trim();
        
        if (meaningLine.length > 60) {
          meaningLine = meaningLine.substring(0, 60) + '...';
        }

        return meaningLine || `${word}(은)는 사전에 등재된 올바른 표준어입니다.`;
      } catch (e) {
        return null;
      }
    }

    function checkMorphologyRule(q, inputVal) {
      if (BANNED_TERMS.some(term => inputVal.includes(term))) return false;

      const target = q.targetWord;
      const alt = q.altWord;

      if (q.position === 'start') {
        const validStart = inputVal.startsWith(target) || (alt && inputVal.startsWith(alt));
        return validStart && inputVal.length > target.length;
      } else if (q.position === 'end') {
        const validEnd = inputVal.endsWith(target) || (alt && inputVal.endsWith(alt));
        return validEnd && inputVal.length > target.length;
      } else {
        const validAny = inputVal.includes(target) || (alt && inputVal.includes(alt));
        return validAny && inputVal.length > target.length;
      }
    }

    async function checkAnswer() {
      if (isProcessing) return;
      isProcessing = true;

      try {
        const inputVal = userInputEl.value.trim().replace(/\s+/g, '');
        if (!inputVal) {
          showMessage('단어를 입력해 주세요!', '', 'msg-incorrect');
          return;
        }

        const q = quizData[currentIndex];

        if (!checkMorphologyRule(q, inputVal)) {
          wordCardEl.classList.add('incorrect-anim');
          showMessage(`제시어 '${q.targetWord}'이(가) 올바르게 결합한 단어가 아니에요!`, '', 'msg-incorrect');
          setTimeout(() => wordCardEl.classList.remove('incorrect-anim'), 400);
          return;
        }

        let isCorrect = false;
        let wordMeaning = '';

        // 1. 내장 사전 DB에서 정답 및 뜻풀이 확인
        if (q.dict && q.dict[inputVal]) {
          isCorrect = true;
          wordMeaning = q.dict[inputVal];
        }

        // 2. 내장 DB에 없으면 오픈 사전 API 조회 및 뜻풀이 실시간 파싱
        if (!isCorrect) {
          showMessage('🔍 사전에 등재된 단어인지 확인 중...', '', 'msg-info');
          const fetchedMeaning = await fetchMeaningFromOpenDictAPI(inputVal);
          if (fetchedMeaning !== null) {
            isCorrect = true;
            wordMeaning = fetchedMeaning;
          }
        }

        if (isCorrect) {
          score += 5;
          scoreCountEl.textContent = `점수: ${score}점`;
          
          wordCardEl.classList.add('correct-anim');
          const meaningTxt = `📘 [사전 뜻] "${wordMeaning}"`;
          showMessage('정답입니다! 🎉', meaningTxt, 'msg-correct');

          setTimeout(() => {
            currentIndex++;
            if (currentIndex < quizData.length) {
              loadQuestion();
            } else {
              showClearScreen();
            }
          }, 2400);

        } else {
          wordCardEl.classList.add('incorrect-anim');
          showMessage('사전에 등록된 표준어 단어가 아니거나 단어 구조에 맞지 않아요!', '', 'msg-incorrect');

          setTimeout(() => {
            wordCardEl.classList.remove('incorrect-anim');
          }, 400);
        }
      } finally {
        setTimeout(() => { isProcessing = false; }, 600);
      }
    }

    function showMessage(mainText, subText, className) {
      let html = `<div class="msg-main ${className}">${mainText}</div>`;
      if (subText) {
        html += `<div class="msg-meaning">${subText}</div>`;
      }
      messageEl.innerHTML = html;
    }

    function showClearScreen() {
      gameScreen.style.display = 'none';
      clearScreen.style.display = 'block';
    }

    submitBtn.addEventListener('click', checkAnswer);
    userInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        checkAnswer();
      }
    });
    restartBtn.addEventListener('click', initGame);

    initGame();
  </script>
