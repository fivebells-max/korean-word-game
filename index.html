<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새말 형성 탐험대 - 어근과 접사 퀴즈</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --success: #10b981;
      --error: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      padding: 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header {
      margin-bottom: 24px;
    }

    .title-badge {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 15px;
    }

    .progress-bar-bg {
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #6366f1, #10b981);
      height: 100%;
      width: 5%;
      transition: width 0.4s ease;
    }

    .card-wrapper {
      perspective: 1000px;
      margin-bottom: 24px;
    }

    .word-card {
      background: linear-gradient(135deg, #ffffff, #f1f5f9);
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 36px 20px;
      position: relative;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .type-tag {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      color: #fff;
    }

    .type-tag.root { background-color: #3b82f6; }
    .type-tag.affix { background-color: #ec4899; }

    .card-word {
      font-size: 48px;
      font-weight: 900;
      color: #0f172a;
      margin: 12px 0 8px 0;
      letter-spacing: 2px;
    }

    .card-hint {
      font-size: 14px;
      color: #64748b;
      word-break: keep-all;
    }

    .correct-anim {
      animation: pop 0.5s ease;
      border-color: var(--success) !important;
      background: #ecfdf5 !important;
    }

    .incorrect-anim {
      animation: shake 0.4s ease;
      border-color: var(--error) !important;
      background: #fef2f2 !important;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.submit-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.submit-btn:hover { background-color: #4338ca; }
    button.submit-btn:active { transform: scale(0.98); }

    .message-area {
      min-height: 28px;
      font-size: 15px;
      font-weight: 700;
      word-break: keep-all;
    }

    .msg-correct { color: var(--success); }
    .msg-incorrect { color: var(--error); }
    .msg-info { color: var(--primary); }

    .clear-screen {
      display: none;
      padding: 20px 0;
    }

    .trophy-emoji {
      font-size: 72px;
      margin-bottom: 16px;
      animation: pop 0.8s infinite alternate;
    }

    .clear-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }

    .clear-desc {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .restart-btn {
      background-color: var(--success);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="game-screen">
      <div class="header">
        <span class="title-badge">중1 국어 2단원 84-85p</span>
        <h2>새말 형성 탐험대 🔍</h2>
      </div>

      <div class="status-bar">
        <span id="question-count">문제 1 / 20</span>
        <span id="score-count">점수: 0점</span>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div class="card-wrapper">
        <div id="word-card" class="word-card">
          <span id="type-tag" class="type-tag affix">접사</span>
          <div id="card-word" class="card-word">풋-</div>
          <p id="card-hint" class="card-hint">어근 앞에 붙어 ‘덜 익은’의 뜻을 더함</p>
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="user-input" placeholder="새로운 단어를 입력하세요" autocomplete="off">
        <button class="submit-btn" id="submit-btn">확인</button>
      </div>

      <div id="message" class="message-area"></div>
    </div>

    <div id="clear-screen" class="clear-screen">
      <div class="trophy-emoji">🎉🏆🎉</div>
      <h2 class="clear-title">탐험 성공! 축하합니다!</h2>
      <p class="clear-desc">20문제를 모두 완벽하게 풀어 100점으로 탐험을 완수했습니다!</p>
      <button class="restart-btn" id="restart-btn">새로운 문제로 다시 도전하기</button>
    </div>
  </div>

  <script>
    // 50문항 확장 및 정답 데이터베이스 보완
    const questionBank = [

      { type: '어근', word: '산', tagClass: 'root', hint: '높이 솟은 자연과 관련된 어근', targetWord: '산', position: 'any', validAnswers: ['산길', '산새', '돌산', '흙산', '산울림', '산꽃', '산골'] },
      { type: '접사', word: '첫-', tagClass: 'affix', hint: '‘맨 처음의’ 뜻을 더하는 접두사', targetWord: '첫', position: 'start', validAnswers: ['첫사랑', '첫눈', '첫인상', '첫날', '첫걸음', '첫마중'] },
      { type: '접사', word: '-스럽다', tagClass: 'affix', hint: '그러한 성질이 있음을 뜻하는 접미사', targetWord: '스럽다', position: 'end', validAnswers: ['자랑스럽다', '사랑스럽다', '조심스럽다', '어른스럽다', '걱정스럽다'] },
      { type: '어근', word: '새', tagClass: 'root', hint: '하늘을 나는 동물과 관련된 어근', targetWord: '새', position: 'any', validAnswers: ['산새', '물새', '알새', '들새', '새장', '새소리', '참새'] },
      { type: '접사', word: '외-', tagClass: 'affix', hint: '‘혼자인’ 또는 ‘어머니 계통의’ (접두사)', targetWord: '외', position: 'start', validAnswers: ['외나무다리', '외길', '외할머니', '외갓집', '외아들', '외딸'] },
      { type: '접사', word: '-치기', tagClass: 'affix', hint: '‘치거나 두드리는 행위’ (접미사)', targetWord: '치기', position: 'end', validAnswers: ['제기치기', '딱지치기', '헤엄치기', '손뼉치기', '기차치기'] },
      { type: '어근', word: '비', tagClass: 'root', hint: '하늘에서 내리는 비 관련 어근', targetWord: '비', position: 'any', validAnswers: ['꽃비', '단비', '봄비', '여름비', '빗물', '빗소리', '소나기'] },
      { type: '접사', word: '되-', tagClass: 'affix', hint: '‘다시’의 뜻을 더하는 접두사', targetWord: '되', position: 'start', validAnswers: ['되풀이', '되새김', '되돌아보다', '되찾다', '되짚다'] },
      { type: '접사', word: '-질하다', tagClass: 'affix', hint: '동작을 연속하여 함을 나타내는 접미사', targetWord: '질하다', position: 'end', validAnswers: ['부채질하다', '가위질하다', '걸레질하다', '다리미질하다', '장난질하다'] },
      { type: '어근', word: '밥', tagClass: 'root', hint: '음식 및 식사와 관련된 어근', targetWord: '밥', position: 'any', validAnswers: ['쌀밥', '보리밥', '볶음밥', '주먹밥', '비빔밥', '찬밥', '덮밥'] },
      { type: '접사', word: '소-', tagClass: 'affix', hint: '‘자잘한’의 뜻을 더하는 접두사', targetWord: '소', position: 'start', validAnswers: ['소나무', '소형', '소규모', '소협곡', '소극장'] },
      { type: '접사', word: '-짓', tagClass: 'affix', hint: '‘신체 동작이나 행동’ (접미사)', targetWord: '짓', position: 'end', validAnswers: ['몸짓', '손짓', '발짓', '눈짓', '몸뚱이짓'] },
      { type: '어근', word: '나무', tagClass: 'root', hint: '식물 및 목재와 관련된 실질적 어근', targetWord: '나무', position: 'any', validAnswers: ['꿈나무', '참나무', '대나무', '소나무', '단풍나무', '나무꾼', '느티나무'] }
    ];

    let quizData = [];
    let currentIndex = 0;
    let score = 0;
    let isProcessing = false;

    const gameScreen = document.getElementById('game-screen');
    const clearScreen = document.getElementById('clear-screen');
    const questionCountEl = document.getElementById('question-count');
    const scoreCountEl = document.getElementById('score-count');
    const progressBarEl = document.getElementById('progress-bar');
    const wordCardEl = document.getElementById('word-card');
    const typeTagEl = document.getElementById('type-tag');
    const cardWordEl = document.getElementById('card-word');
    const cardHintEl = document.getElementById('card-hint');
    const userInputEl = document.getElementById('user-input');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restart-btn');

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initGame() {
      const shuffled = shuffleArray(questionBank);
      quizData = shuffled.slice(0, 20);
      currentIndex = 0;
      score = 0;
      
      clearScreen.style.display = 'none';
      gameScreen.style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      const q = quizData[currentIndex];
      typeTagEl.textContent = q.type;
      typeTagEl.className = `type-tag ${q.tagClass}`;
      cardWordEl.textContent = q.word;
      cardHintEl.textContent = q.hint;
      
      questionCountEl.textContent = `문제 ${currentIndex + 1} / ${quizData.length}`;
      scoreCountEl.textContent = `점수: ${score}점`;
      progressBarEl.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
      
      userInputEl.value = '';
      userInputEl.focus();
      messageEl.textContent = '';
      messageEl.className = 'message-area';
      wordCardEl.className = 'word-card';
      isProcessing = false;
    }

    // 오픈 사전 API 실시간 검색 알고리즘 보완
    async function verifyWithOpenDictAPI(word) {
      try {
        const url = `https://ko.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`;
        const response = await fetch(url);
        if (!response.ok) return false;
        const data = await response.json();
        const pages = data.query.pages;
        const pageId = Object.keys(pages)[0];
        
        return pageId !== "-1";
      } catch (e) {
        return false;
      }
    }

    function checkMorphologyRule(q, inputVal) {
      if (q.position === 'start') {
        return inputVal.startsWith(q.targetWord) && inputVal.length > q.targetWord.length;
      } else if (q.position === 'end') {
        return inputVal.endsWith(q.targetWord) && inputVal.length > q.targetWord.length;
      } else {
        return inputVal.includes(q.targetWord) && inputVal.length > q.targetWord.length;
      }
    }

    async function checkAnswer() {
      if (isProcessing) return;

      const inputVal = userInputEl.value.trim().replace(/\s+/g, '');
      if (!inputVal) {
        showMessage('단어를 입력해 주세요!', 'msg-incorrect');
        return;
      }

      const q = quizData[currentIndex];

      // 1. 접사/어근 결합 규칙 검사
      if (!checkMorphologyRule(q, inputVal)) {
        wordCardEl.classList.add('incorrect-anim');
        showMessage(`이 단어는 제시어 '${q.targetWord}'이(가) 포함되어 있지 않아요!`, 'msg-incorrect');
        setTimeout(() => wordCardEl.classList.remove('incorrect-anim'), 400);
        return;
      }

      // 2. 내장 데이터베이스 우선 검사
      let isCorrect = q.validAnswers.some(ans => ans.replace(/\s+/g, '') === inputVal);

      // 3. 내장 정답에 없으면 온라인 사전 실시간 검색
      if (!isCorrect) {
        showMessage('🔍 사전에 등재된 단어인지 확인 중...', 'msg-info');
        isProcessing = true;
        const isDictValid = await verifyWithOpenDictAPI(inputVal);
        if (isDictValid) {
          isCorrect = true;
        }
        isProcessing = false;
      }

      if (isCorrect) {
        isProcessing = true;
        score += 5;
        scoreCountEl.textContent = `점수: ${score}점`;
        
        wordCardEl.classList.add('correct-anim');
        showMessage('정답입니다! 🎉 사전에 등록된 올바른 단어입니다!', 'msg-correct');

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < quizData.length) {
            loadQuestion();
          } else {
            showClearScreen();
          }
        }, 1200);

      } else {
        wordCardEl.classList.add('incorrect-anim');
        showMessage('사전에 등록된 표준어 단어가 아니거나 단어 구조에 맞지 않아요!', 'msg-incorrect');

        setTimeout(() => {
          wordCardEl.classList.remove('incorrect-anim');
        }, 400);
      }
    }

    function showMessage(text, className) {
      messageEl.textContent = text;
      messageEl.className = `message-area ${className}`;
    }

    function showClearScreen() {
      gameScreen.style.display = 'none';
      clearScreen.style.display = 'block';
    }

    submitBtn.addEventListener('click', checkAnswer);
    userInputEl.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });
    restartBtn.addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
