<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새말 형성 탐험대 - 어근과 접사 퀴즈</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --success: #10b981;
      --error: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      padding: 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header {
      margin-bottom: 24px;
    }

    .title-badge {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 15px;
    }

    .progress-bar-bg {
      background-color: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #6366f1, #10b981);
      height: 100%;
      width: 5%;
      transition: width 0.4s ease;
    }

    .card-wrapper {
      perspective: 1000px;
      margin-bottom: 24px;
    }

    .word-card {
      background: linear-gradient(135deg, #ffffff, #f1f5f9);
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 36px 20px;
      position: relative;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .type-tag {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      color: #fff;
    }

    .type-tag.root { background-color: #3b82f6; }
    .type-tag.affix { background-color: #ec4899; }

    .card-word {
      font-size: 48px;
      font-weight: 900;
      color: #0f172a;
      margin: 12px 0 8px 0;
      letter-spacing: 2px;
    }

    .card-hint {
      font-size: 14px;
      color: #64748b;
      word-break: keep-all;
    }

    .correct-anim {
      animation: pop 0.5s ease;
      border-color: var(--success) !important;
      background: #ecfdf5 !important;
    }

    .incorrect-anim {
      animation: shake 0.4s ease;
      border-color: var(--error) !important;
      background: #fef2f2 !important;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.submit-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.submit-btn:hover { background-color: #4338ca; }
    button.submit-btn:active { transform: scale(0.98); }

    .message-area {
      min-height: 28px;
      font-size: 15px;
      font-weight: 700;
      word-break: keep-all;
    }

    .msg-correct { color: var(--success); }
    .msg-incorrect { color: var(--error); }
    .msg-info { color: var(--primary); }

    .clear-screen {
      display: none;
      padding: 20px 0;
    }

    .trophy-emoji {
      font-size: 72px;
      margin-bottom: 16px;
      animation: pop 0.8s infinite alternate;
    }

    .clear-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }

    .clear-desc {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .restart-btn {
      background-color: var(--success);
      color: white;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="game-screen">
      <div class="header">
        <span class="title-badge">중1 국어 2단원 84-85p</span>
        <h2>새말 형성 탐험대 🔍</h2>
      </div>

      <div class="status-bar">
        <span id="question-count">문제 1 / 20</span>
        <span id="score-count">점수: 0점</span>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div class="card-wrapper">
        <div id="word-card" class="word-card">
          <span id="type-tag" class="type-tag affix">접사</span>
          <div id="card-word" class="card-word">풋-</div>
          <p id="card-hint" class="card-hint">어근 앞에 붙어 ‘덜 익은’의 뜻을 더함</p>
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="user-input" placeholder="새로운 단어를 입력하세요" autocomplete="off">
        <button class="submit-btn" id="submit-btn">확인</button>
      </div>

      <div id="message" class="message-area"></div>
    </div>

    <div id="clear-screen" class="clear-screen">
      <div class="trophy-emoji">🎉🏆🎉</div>
      <h2 class="clear-title">탐험 성공! 축하합니다!</h2>
      <p class="clear-desc">20문제를 모두 완벽하게 풀어 100점으로 탐험을 완수했습니다!</p>
      <button class="restart-btn" id="restart-btn">새로운 문제로 다시 도전하기</button>
    </div>
  </div>

  <script>
    // 50문항 확장 및 정답 데이터베이스 보완
    const questionBank = [
      { type: '접사', word: '풋-', tagClass: 'affix', hint: '‘덜 익은’의 뜻을 더함 (접두사)', targetWord: '풋', position: 'start', validAnswers: ['풋사랑', '풋과일', '풋사과', '풋고추', '풋나물', '풋잠', '풋낯', '풋바둑'] },
      { type: '어근', word: '물', tagClass: 'root', hint: '다른 어근이나 접사와 결합하는 실질적 어근', targetWord: '물', position: 'any', validAnswers: ['샘물', '물개', '먹물', '물통', '물병', '눈물', '물수제비', '물걸레', '수돗물', '물구름', '물안개', '물약'] },
      { type: '접사', word: '-꾼', tagClass: 'affix', hint: '‘어떤 일을 전문적/습관적으로 하는 사람’ (접미사)', targetWord: '꾼', position: 'end', validAnswers: ['누리꾼', '사냥꾼', '장난꾼', '구경꾼', '낚시꾼', '일꾼', '살림꾼', '말꾼', '춤꾼', '씨름꾼'] },
      { type: '접사', word: '햇-', tagClass: 'affix', hint: '‘당해에 새로 난’의 뜻을 더함 (접두사)', targetWord: '햇', position: 'start', validAnswers: ['햇밤', '햇곡식', '햇과일', '햇쌀', '햇감자', '햇고구마', '햇보리', '햇마늘', '햇양파'] },
      { type: '접사', word: '-쟁이', tagClass: 'affix', hint: '‘그 속성을 유난히 많이 지닌 사람’ (접미사)', targetWord: '쟁이', position: 'end', validAnswers: ['방귀쟁이', '고집쟁이', '멋쟁이', '겁쟁이', '수다쟁이', '떼쟁이', '개구쟁이', '욕심쟁이', '변덕쟁이'] },
      { type: '어근', word: '꿈', tagClass: 'root', hint: '다른 어근과 결합하여 합성어를 만드는 어근', targetWord: '꿈', position: 'any', validAnswers: ['꿈길', '꿈나무', '꿈결', '꿈나라', '꿈자리', '돼지꿈', '첫꿈', '꿈속'] },
      { type: '접사', word: '홑-', tagClass: 'affix', hint: '‘한 겹으로 된’ 또는 ‘하나인’ (접두사)', targetWord: '홑', position: 'start', validAnswers: ['홑이불', '홑잎', '홑옷', '홑문', '홑몸', '홑소리', '홑문장'] },
      { type: '접사', word: '-질', tagClass: 'affix', hint: '‘도구를 사용하는 동작이나 일 또는 행동’ (접미사)', targetWord: '질', position: 'end', validAnswers: ['부채질', '가위질', '걸레질', '다리미질', '숟가락질', '붓질', '칼질', '장난질', '주먹질', '손가락질', '도끼질', '질부채'] },
      { type: '접사', word: '잔-', tagClass: 'affix', hint: '‘가느다란’ 또는 ‘자잘한’ (접두사)', targetWord: '잔', position: 'start', validAnswers: ['잔가지', '잔가시', '잔머리', '잔주름', '잔돈', '잔심부름', '잔정', '잔파'] },
      { type: '어근', word: '꽃', tagClass: 'root', hint: '다른 어근이나 접사와 결합하는 어근', targetWord: '꽃', position: 'any', validAnswers: ['꽃집', '나팔꽃', '꽃비', '불꽃', '눈꽃', '들꽃', '제비꽃', '꽃밭', '꽃다발'] },
      { type: '접사', word: '군-', tagClass: 'affix', hint: '‘쓸데없는’ 또는 ‘가선의’ (접두사)', targetWord: '군', position: 'start', validAnswers: ['군소리', '군살', '군식구', '군말', '군손질', '군눈', '군침'] },
      { type: '접사', word: '-보', tagClass: 'affix', hint
